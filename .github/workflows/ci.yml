name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-contract:
    name: Offline contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate installer syntax
        run: sh -n scripts/install.sh

      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  latest-hermes-discovery:
    name: Latest Hermes discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify user-provider discovery against Hermes main
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eu
          hermes_checkout="$RUNNER_TEMP/hermes-agent"
          hermes_home="$RUNNER_TEMP/hermes-home"
          plugin_dir="$hermes_home/plugins/model-providers/apertis"

          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$hermes_checkout"
          mkdir -p "$plugin_dir"
          cp -R __init__.py plugin.yaml hermes_apertis_provider "$plugin_dir/"

          HERMES_HOME="$hermes_home" PYTHONPATH="$hermes_checkout" python - <<'PY'
          from providers import get_provider_profile

          canonical = get_provider_profile("apertis")
          assert canonical is not None
          assert canonical.name == "apertis"
          assert get_provider_profile("apertis-ai") is canonical
          assert get_provider_profile("apertis-api") is canonical
          print("latest Hermes discovery: ok")
          PY

  package-artifacts:
    name: Package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build and check distributions
        run: |
          python -m pip install build==1.5.1 twine==6.2.0
          python -m build
          python -m twine check dist/*

      - name: Verify wheel discovery against Hermes main
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eu
          hermes_checkout="$RUNNER_TEMP/hermes-agent"
          wheel_venv="$RUNNER_TEMP/wheel-venv"

          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$hermes_checkout"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install dist/*.whl

          PYTHONPATH="$hermes_checkout" "$wheel_venv/bin/python" - <<'PY'
          from providers import get_provider_profile

          canonical = get_provider_profile("apertis")
          assert canonical is not None
          assert canonical.name == "apertis"
          assert get_provider_profile("apertis-ai") is canonical
          assert get_provider_profile("apertis-api") is canonical
          print("wheel discovery: ok")
          PY
