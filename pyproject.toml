[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-apertis-provider"
version = "1.1.0"
description = "Apertis AI model-provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Apertis AI" },
]
keywords = ["apertis", "hermes-agent", "llm", "model-provider"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://apertis.ai"
Repository = "https://github.com/apertis-ai/hermes-apertis-provider"
Issues = "https://github.com/apertis-ai/hermes-apertis-provider/issues"
Changelog = "https://github.com/apertis-ai/hermes-apertis-provider/blob/main/CHANGELOG.md"

[project.entry-points."hermes_agent.model_providers"]
apertis = "hermes_apertis_provider:register"

[tool.setuptools]
packages = ["hermes_apertis_provider"]
